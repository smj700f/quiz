<title>Quiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:26px;margin:14px 0 4px}h2{margin:0 0 4px;font-size:21px}h3{margin:14px 0 8px;font-size:16px}
p{margin:6px 0}.mu{color:var(--mu);font-size:15px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);margin:14px 0;border:1px solid var(--bd)}
.mode{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);cursor:pointer}
.mode:hover{border-color:var(--pr)}
.btn{border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--pr);color:var(--prt)}
.btn.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.w{display:block;width:100%;margin:10px 0}
.lnk{border:0;background:none;color:var(--pr);font:inherit;font-weight:700;cursor:pointer;padding:6px}
.chips.sc{max-height:34vh;overflow:auto;padding:4px;margin-bottom:10px}.chip.cok{background:var(--ok);border-color:var(--ok);color:var(--okt)}.chip.cbad{background:var(--bad);border-color:var(--bad);color:#fff}
.top{flex-wrap:wrap;display:flex;align-items:center;gap:10px;margin-bottom:10px}.top .mu{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.bar div{max-width:760px;margin:auto;display:flex;gap:10px}.bar .btn{flex:1}
.pg{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:12px}.pg i{display:block;height:100%;background:var(--pr);transition:width .25s}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-bottom:4px}
.chip{border:2px solid var(--bd);border-radius:10px;padding:5px 0;background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.an{background:var(--pr);color:var(--prt);border-color:var(--pr)}.chip.cur{outline:3px solid var(--tx);outline-offset:1px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mu);font-size:13px;font-weight:700}
.stem{font-size:19px;font-weight:600;white-space:pre-line;margin:10px 0 6px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:15px}
.opt span{flex:1;white-space:pre-line}.opt em{font-style:normal;font-size:14px;white-space:nowrap;font-weight:700}
.opt:hover{border-color:var(--pr)}.opt.sel{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr) inset}
.opt.ok{background:var(--ok);border-color:var(--ok);color:var(--okt);font-weight:700}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.opt.ok b,.opt.bad b{background:rgba(255,255,255,.4)}.opt.lock{pointer-events:none}
.fb{padding:12px 16px;border-radius:12px;font-weight:700;margin-top:8px}.fb.ok{background:var(--ok);color:var(--okt)}.fb.bad{background:var(--bad);color:#fff}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px 6px;font:inherit;background:transparent;color:var(--mu);cursor:pointer;font-weight:600}
.seg .on{background:var(--pr);color:var(--prt)}
.big{font-size:64px;font-weight:800;line-height:1.1}.big small{font-size:22px;color:var(--mu);font-weight:600}
.c{text-align:center}
</style>
